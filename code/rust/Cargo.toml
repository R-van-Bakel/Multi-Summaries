[package]
name = "multi_summaries"
version = "0.1.0"
edition = "2024"

[dependencies]
biterator = "0.3.0"
fxhash = "0.2.1"
itertools = "0.14.0"
memmap2 = "0.9.9"
rayon = "1.11.0"
thiserror = "2.0.18"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
procfs = "0.18.0"
time = { version = "0.3.47", features = ["local-offset"]}


[dev-dependencies]
tempfile = "3"

[features]
default = ["instrument"]
instrument = []

#[profile.release]
#debug = true
